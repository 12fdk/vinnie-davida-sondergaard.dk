name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Minify the shared stylesheet into the deploy artifact only — the file in
      # the repo stays readable, comments and all, because it doubles as the
      # design-token documentation. lightningcss is a real CSS parser (not a
      # regex), so it also lowers modern syntax for older browsers.
      - name: Minify CSS
        run: |
          npx --yes lightningcss-cli@1.30.1 --minify --targets '>= 0.25%' \
            assets/css/tokens.css -o /tmp/tokens.min.css
          # Only swap it in if the minifier actually produced something.
          test -s /tmp/tokens.min.css
          mv /tmp/tokens.min.css assets/css/tokens.css
          ls -l assets/css/tokens.css

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
